<!doctype html>
<meta charset="utf-8">
<title>Engine harness</title>
<body style="font:13px monospace;background:#fff">
<pre id="o">running…</pre>
<script type="module">
// Calibration harness. ?league=ncaa|wnba&n=2000&level=9  (level = average rating of the generated teams)
// &real=1 uses the real rosters (js/data/real.js) instead: random pairings of teams in that league.
import { Game, ovr } from './js/engine/game.js';
import { makeRng } from './js/engine/rng.js';
import { genRoster } from './js/data/gen.js';
const q = new URLSearchParams(location.search);
const league = q.get('league') || 'ncaa', N = +(q.get('n') || 2000), level = +(q.get('level') || (league === 'ncaa' ? 9 : 14));
const T = { ncaa: { poss: 70.9, pts: 66.3, fga: 59.0, fg_pct: .408, tpa: 20.0, tp_pct: .310, fta: 16.8, ft_pct: .713, orb: 11.6, drb: 25.2, orb_pct: .316, ast: 13.3, stl: 8.3, blk: 3.2, tov: 16.1, pf: 16.75 },
            wnba: { poss: 82.3, pts: 87.1, fga: 68.6, fg_pct: .452, tpa: 25.5, tp_pct: .340, fta: 20.8, ft_pct: .786, orb: 8.5, drb: 25.0, orb_pct: .255, ast: 20.7, stl: 7.4, blk: 4.0, tov: 13.1, pf: 19.8 } }[league];
const o = document.getElementById('o'), out = [];
const rng = makeRng(+(q.get('seed') || 7));
let teams;
if (q.get('real')) {
  const R = await import('./js/data/real.js');
  const P = id => { const p = R.PLAYERS[id]; return { ...p, r: Object.fromEntries(R.RATING_KEYS.map((k, i) => [k, p.r[i]])) }; };
  teams = R.TEAMS.filter(t => t.league === league).map(t => ({ id: t.id, name: t.name, conf: t.conf, players: t.roster.map(P).sort((a, b) => b.L - a.L).slice(0, league === 'ncaa' ? 15 : 12) }));
} else teams = Array.from({ length: 40 }, (_, i) => ({ id: 't' + i, name: 'T' + i, players: genRoster(rng, level + rng.gauss() * 0.6, league) }));
const tactic = q.get('off') || null, dtac = q.get('def') || null;
const S = {}, add = (k, v) => S[k] = (S[k] || 0) + v;
let games = 0, ot = 0, homeW = 0, t0 = performance.now();
const margins = [];
for (let g = 0; g < N; g++) {
  const a = teams[Math.floor(rng() * teams.length)]; let b;
  const same = teams.filter(t => t.conf === a.conf && t !== a);
  if (q.get('mirror')) b = { ...a, id: a.id + 'x' };
  else if (q.get('real') && same.length && rng() < 0.62) b = same[Math.floor(rng() * same.length)];
  else do { b = teams[Math.floor(rng() * teams.length)]; } while (b === a);
  const G = new Game({ ...a, tactics: tactic ? { off: tactic, def: dtac || 'man' } : undefined }, { ...b, tactics: dtac ? { def: dtac } : undefined }, { league, seed: g * 7919 + 1 });
  const r = G.run(); games++; if (r.ot) ot++; if (r.winner === 0) homeW++;
  margins.push(Math.abs(r.score[0] - r.score[1]));
  for (const tm of r.tm) for (const k in tm) add(k, tm[k]);
  add('ms', 0);
}
const n2 = games * 2, pg = k => S[k] / n2;
const row = (k, v, t) => `${k.padEnd(8)} ${v.toFixed(3).padStart(8)}   real ${t == null ? '' : t.toFixed(3)}`;
out.push(`${league} games=${games} level=${level} ${q.get('real') ? 'REAL' : ''} ${(performance.now() - t0).toFixed(0)}ms`);
S.poss = S.fga - S.orb + S.tov + 0.44 * S.fta;
out.push(row('poss', pg('poss'), T.poss), row('pts', pg('pts'), T.pts), row('fga', pg('fga'), T.fga), row('fg%', S.fgm / S.fga, T.fg_pct),
  row('3pa', pg('tpa'), T.tpa), row('3p%', S.tpm / S.tpa, T.tp_pct), row('fta', pg('fta'), T.fta), row('ft%', S.ftm / S.fta, T.ft_pct),
  row('orb', pg('orb'), T.orb), row('drb', pg('drb'), T.drb), row('orb%', S.orb / (S.orb + S.drb), T.orb_pct), row('ast', pg('ast'), T.ast), row('stl', pg('stl'), T.stl),
  row('blk', pg('blk'), T.blk), row('tov', pg('tov'), T.tov), row('pf', pg('pf'), T.pf), row('ppp', S.pts / S.poss, T.pts / T.poss));
out.push(`OT rate ${(ot / games).toFixed(3)}  home win ${(homeW / games).toFixed(3)}  avg margin ${(margins.reduce((s, x) => s + x, 0) / games).toFixed(1)}`);
// Strength check: level gap -> win% and margin
if (!q.get('real')) for (const gap of [1, 2, 4]) {
  let w = 0, m = 0; const M = 400;
  for (let g = 0; g < M; g++) {
    const A = { id: 'a', name: 'A', players: genRoster(rng, level + gap / 2, league) }, B = { id: 'b', name: 'B', players: genRoster(rng, level - gap / 2, league) };
    const r = new Game(g % 2 ? A : B, g % 2 ? B : A, { league, seed: g + 99, neutral: true }).run();
    const ai = g % 2 ? 0 : 1; if (r.winner === ai) w++; m += r.score[ai] - r.score[1 - ai];
  }
  out.push(`gap ${gap}: stronger wins ${(w / M).toFixed(3)}  margin ${(m / M).toFixed(1)}`);
}
o.textContent = out.join('\n');
</script>
